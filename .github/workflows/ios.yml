name: Build iOS

# Build file .ipa (chưa ký) cho iPhone/iPad. Cài lên máy bằng Sideloadly, AltStore hoặc SideStore
# (các công cụ này tự ký lại bằng Apple ID của bạn). Xem hướng dẫn trong README.
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "app/src/test/resources/fixtures/**"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Test lõi (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v6
      - name: Swift test
        run: swift test --package-path ios/TubeSachCore

  build-ipa:
    name: Build IPA (macOS)
    needs: core-tests
    runs-on: macos-15
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/TubeSach.xcodeproj \
            -scheme TubeSach \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|warning: .*TubeSach|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          test -d ios/build/Build/Products/Release-iphoneos/TubeSach.app

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/TubeSach.app dist/Payload/
          cd dist && zip -qry "../TubeSach-${VERSION_NAME}.ipa" Payload
          ls -lh "../TubeSach-${VERSION_NAME}.ipa"

      - uses: actions/upload-artifact@v6
        with:
          name: TubeSach-iOS-${{ env.VERSION_NAME }}
          path: TubeSach-*.ipa

      # Bản phát hành iOS không đánh dấu "latest" để không làm hỏng việc tự cập nhật của app Android.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-v${VERSION_NAME}" "TubeSach-${VERSION_NAME}.ipa" \
            --target "${GITHUB_SHA}" \
            --title "Tube Sạch iOS ${VERSION_NAME}" \
            --latest=false \
            --notes "Tải file **TubeSach-${VERSION_NAME}.ipa** rồi cài lên iPhone/iPad bằng Sideloadly, AltStore hoặc SideStore (xem README, mục *Bản iPhone / iPad*). Cài bản mới đè lên bản cũ không mất lịch sử."

  # Chạy app trên iPhone/iPad giả lập và chụp màn hình (chỉ chạy khi commit có "[screenshots]" hoặc bấm tay).
  screenshots:
    name: Chụp màn hình (máy ảo)
    needs: core-tests
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Build for simulator
        run: |
          brew install xcodegen
          cd ios && xcodegen generate && cd ..
          set -o pipefail
          xcodebuild \
            -project ios/TubeSach.xcodeproj \
            -scheme TubeSach \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/simbuild \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d ios/simbuild/Build/Products/Debug-iphonesimulator/TubeSach.app

      - name: Run and take screenshots
        run: ios/scripts/simulator-screenshots.sh ios/simbuild/Build/Products/Debug-iphonesimulator/TubeSach.app screenshots

      - uses: actions/upload-artifact@v6
        with:
          name: TubeSach-iOS-screenshots
          path: screenshots/*.png

      # In ảnh thu nhỏ ra log (base64) để xem được mà không cần tải artifact.
      - name: Print thumbnails
        run: |
          mkdir -p thumbs
          for f in screenshots/*.png; do
            n=$(basename "$f" .png)
            sips -s format jpeg -s formatOptions 55 -Z 900 "$f" --out "thumbs/$n.jpg" >/dev/null
            echo "=====BEGIN $n.jpg====="
            base64 -i "thumbs/$n.jpg" | tr -d '\n' | fold -w 4000
            echo
            echo "=====END $n.jpg====="
          done
