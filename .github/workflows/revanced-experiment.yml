# Thử nghiệm RIÊNG, không liên quan app Tube Sạch:
# vá YouTube bằng ReVanced mà KHÔNG dùng microG, rồi chạy thử trên giả lập Android có Google Play.
# Xem experiments/README.md.
name: Thử ReVanced không microG

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Mã video dùng để thử"
        required: false
        default: "dQw4w9WgXcQ"
  push:
    branches: ["claude/**"]
    paths:
      # Chỉ chạy khi mã thử nghiệm đổi (không chạy lại khi chỉ cập nhật ảnh/kết quả trong ket-qua/).
      - "experiments/revanced/*.sh"
      - "experiments/revanced/*.py"
      - ".github/workflows/revanced-experiment.yml"

permissions:
  contents: read

concurrency:
  group: revanced-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revanced:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VIDEO_ID: ${{ github.event.inputs.video_id || 'dQw4w9WgXcQ' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Vá YouTube bằng ReVanced
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash experiments/revanced/build.sh apks

      - name: Lưu APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: revanced-apks
          path: |
            apks/*.apk
            apks/*.apkm
            apks/*.txt
            apks/*.log
          retention-days: 7

      - name: Bật KVM cho giả lập
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Chạy thử trên giả lập có Google Play (không microG)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: bash experiments/revanced/test-emulator.sh apks results

      - name: Lưu kết quả (ảnh chụp, log)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ket-qua-gia-lap
          path: results
          retention-days: 14
