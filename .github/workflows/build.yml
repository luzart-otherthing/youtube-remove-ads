name: Build APK (điện thoại + Google TV)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      VERSION_NAME: 2.0.${{ github.run_number }}
      UPDATE_REPO: ${{ github.repository }}
      HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Tuỳ chọn: dùng khoá ký riêng lưu trong GitHub Secrets thay cho khoá mặc định trong repo.
      - name: Use private signing key
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}"
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :core:testDebugUnitTest :app:testDebugUnitTest :tv:testDebugUnitTest --stacktrace

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease :tv:assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk "TubeSach-${VERSION_NAME}.apk"
          cp tv/build/outputs/apk/release/tv-release.apk "TubeSachTV-${VERSION_NAME}.apk"

      # App TV phải hiện trên màn hình chính của Google TV (LEANBACK_LAUNCHER + banner).
      - name: Check TV manifest
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "TubeSachTV-${VERSION_NAME}.apk" > badging.txt
          grep -q "leanback-launchable-activity" badging.txt
          grep -q "banner=" badging.txt
          grep -q "uses-feature-not-required: name='android.hardware.touchscreen'" badging.txt

      - uses: actions/upload-artifact@v6
        with:
          name: TubeSach-${{ env.VERSION_NAME }}
          path: TubeSach-*.apk

      - uses: actions/upload-artifact@v6
        with:
          name: TubeSachTV-${{ env.VERSION_NAME }}
          path: TubeSachTV-*.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # APK điện thoại tải lên trước, APK TV tải lên sau ở lệnh riêng: các bản app điện thoại cũ
        # (trước 2.0.3) chỉ lấy file .apk đầu tiên khi kiểm tra cập nhật nên không được tải nhầm APK TV.
        run: |
          gh release create "v${VERSION_NAME}" "TubeSach-${VERSION_NAME}.apk" \
            --target "${GITHUB_SHA}" \
            --title "Tube Sạch ${VERSION_NAME}" \
            --latest \
            --notes "- **Điện thoại Android:** tải **TubeSach-${VERSION_NAME}.apk** rồi bấm vào để cài.
          - **TV Google TV / Android TV** (ví dụ Coocaa): tải **TubeSachTV-${VERSION_NAME}.apk**, cách cài xem file docs/HUONG_DAN_CAI_TV.md trong repo.

          Bản mới cài đè lên bản cũ được, không mất lịch sử xem."
          # Thêm bản tên cố định để có link tải không đổi:
          # https://github.com/<repo>/releases/latest/download/TubeSachTV.apk (chỉ dùng được khi repo công khai)
          cp "TubeSachTV-${VERSION_NAME}.apk" TubeSachTV.apk
          gh release upload "v${VERSION_NAME}" "TubeSachTV-${VERSION_NAME}.apk" TubeSachTV.apk
